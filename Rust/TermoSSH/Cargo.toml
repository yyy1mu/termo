[package]
name = "termo-ssh"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib 供同包 bin/测试使用；staticlib 供 Xcode 链接
crate-type = ["staticlib", "rlib"]

[dependencies]
rand = "0.10"
russh = { version = "=0.63.3", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
