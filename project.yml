# XcodeGen 声明式工程定义。改这里后运行 `xcodegen generate` 重新生成 Termo.xcodeproj。
# macOS 业务代码直接归属 Termo App target；跨端的无平台依赖模型归属 TermoCore。
# iOS 与 watchOS 各自保留独立入口和功能目录；第三方依赖以 Swift Package 形式引入。
name: Termo

options:
  bundleIdPrefix: com.cloudza
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true        # 子目录(App/Core/Features/UI/System)映射为分组
  defaultConfig: Debug
  groupSortPosition: top
  developmentLanguage: zh-Hans          # 源语言=简体中文；String Catalog 以中文字面量为 key

# 构建配置：Debug/Release = Developer ID 直发（不沙盒、本地终端满血）；
# ReleaseMAS = Mac App Store（App Sandbox + TERMO_MAS 编译开关，隐藏本地终端、私钥仅走密钥库）。
# MAS 构建：xcodebuild -scheme Termo -configuration ReleaseMAS（签名/描述文件待 J4 上架时配 Apple Distribution）。
configs:
  Debug: debug
  Release: release
  DebugMAS: debug         # 本地测沙盒：debug 优化 + App Sandbox + TERMO_MAS（可断点/日志）
  ReleaseMAS: release      # 上架：release 优化 + App Sandbox + TERMO_MAS

settings:
  base:
    # 版本号唯一源是 Termo/Info.plist 的 CFBundleShortVersionString / CFBundleVersion
    # （运行期由 AppInfo 从主包读取，打包脚本从构建产物 Info.plist 读取）。这里不再重复声明
    # MARKETING_VERSION，避免与 Info.plist 不一致；升版本只改 Info.plist 一处即可。
    SWIFT_VERSION: "5.9"
    SWIFT_EMIT_LOC_STRINGS: YES          # 编译期把可本地化字符串抽取进 String Catalog
    DEAD_CODE_STRIPPING: YES
    # Debug 签名会向 entitlements 注入 get-task-allow；本项目 entitlements 为空占位（Dev ID 不沙盒），
    # 最新 Xcode 会把这次注入判为「构建期修改了 entitlements 文件」而报错中止。此设置允许该注入（官方修复项）。
    CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
    # 开发签名：自动管理，由 Xcode 用本账号的 Apple Development 证书签名 + 自动管描述文件。
    # 分发证书（直发 Developer ID Application / 上架 Apple Distribution）待创建后再按发布方式覆盖；
    # package-app.sh 归档时仍以参数覆盖为 ad-hoc，公证管线接入时再改那里。
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KTP97H9YFF

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.13.0"
  # 三端共享的纯 Foundation 数据契约；平台实现留在各 App target。
  TermoCore:
    path: TermoCore

targets:
  Termo:
    type: application
    platform: macOS
    sources:
      - path: Termo
        excludes:
          - "Info.plist"          # 作为 INFOPLIST_FILE，不当资源拷贝
          - "**/.DS_Store"
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: TermoCore
        product: TermoCore
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        INFOPLIST_FILE: Termo/Info.plist
        ARCHS: arm64  # macOS 仅 Apple Silicon；iOS/watchOS 使用各自 SDK 默认设备架构
        # Cargo 会读取 Rust 源码及用户级依赖缓存；Xcode 的脚本沙盒无法用静态输入列表覆盖。
        # 仅对含 Rust 预构建脚本的 macOS target 关闭，其他 target 仍使用默认设置。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # SSH 引擎 C 接口经桥接头暴露给 Swift（Engine 目录在搜索路径中）。
        SWIFT_OBJC_BRIDGING_HEADER: Termo/Bridge/Termo-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Termo/Features/SSH/Engine                                # TermoSSHCore.h / TermoRusshCore.h
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Build/russh/universal   # libtermo_ssh.a（russh 通用静态库，见 scripts/build-russh.sh）
        OTHER_LDFLAGS:
          - -ltermo_ssh  # Rust SSH 引擎（russh 0.63.3 + ring；符号 termo_russh_*）
          - -liconv      # ring/系统层依赖
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Termo
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudza.termo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Termo.entitlements
        DEVELOPMENT_TEAM: 93D9T7Y56M  # 沿用现有 macOS target 的本机开发签名覆盖
        ENABLE_HARDENED_RUNTIME: NO       # 上架/公证阶段再打开
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"          # 体积优先（对 IO/终端型应用性能影响可忽略）
          ASSETCATALOG_COMPILER_OPTIMIZATION: space   # 资产目录按体积优化
          # 去符号由 xcodebuild archive 的 install-time 处理（strip 主程序 + 分离 dSYM）；
          # 见 scripts/package-app.sh。dwarf-with-dsym 为 Release 默认，保留以便崩溃符号化。
        DebugMAS:
          CODE_SIGN_ENTITLEMENTS: Termo-MAS.entitlements      # 开 App Sandbox（本地测沙盒运行态）
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG TERMO_MAS
        ReleaseMAS:
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          ASSETCATALOG_COMPILER_OPTIMIZATION: space
          CODE_SIGN_ENTITLEMENTS: Termo-MAS.entitlements      # 开 App Sandbox
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: TERMO_MAS      # 编译期渠道开关（隐藏本地终端、私钥仅库）
    # 编译前先产出 russh 静态库（cargo 增量构建，日常 <2s；产物 Build/ 不入库）。
    preBuildScripts:
      - name: "Build Rust SSH static library"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"   # Xcode 脚本环境默认不含 Homebrew
          "$SRCROOT/scripts/build-russh.sh"

  # iOS 先落地无凭证的主机资料；SSH 引擎与认证按平台能力逐步接入。
  Termo-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/Termo-iOS
    dependencies:
      - package: TermoCore
        product: TermoCore
      - target: Termo-Watch
        embed: true
    settings:
      base:
        PRODUCT_NAME: Termo
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudza.termo.ios
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  # Watch 是 iPhone 的伴侣应用，只接收无凭证的主机名称快照。
  Termo-Watch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Termo-Watch
    dependencies:
      - package: TermoCore
        product: TermoCore
    settings:
      base:
        PRODUCT_NAME: Termo
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudza.termo.ios.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.cloudza.termo.ios

schemes:
  Termo:
    build:
      targets:
        Termo: all
    run:
      config: Debug
    archive:
      config: Release
  # MAS（沙盒）本地测试 / 上架归档专用 scheme：在 Xcode 顶部切到它即可 Run 沙盒版（Apple Development 签名即激活沙盒）。
  Termo-MAS:
    build:
      targets:
        Termo: all
    run:
      config: DebugMAS
    archive:
      config: ReleaseMAS
  Termo-iOS:
    build:
      targets:
        Termo-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  Termo-Watch:
    build:
      targets:
        Termo-Watch: all
    run:
      config: Debug
    archive:
      config: Release
